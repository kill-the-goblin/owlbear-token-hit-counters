<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /></head>
  <body>
    <div id="app">
      <div class="controls">
        <label for="maximum">Boxes</label>
        <input id="maximum" type="text" inputmode="numeric" autocomplete="off" aria-label="Total hit boxes, 0 to 10" placeholder="0–10" />
        <span id="remaining">No counter</span>
      </div>
      <div class="controls">
        <label for="offset">Offset Y (px)</label>
        <input id="offset" type="number" min="-200" max="200" step="1" title="Negative moves the grid up" />
      </div>
      <div class="controls">
        <label for="color">Color</label>
        <select id="color"></select>
      </div>
      <small>Negative offset moves the grid up.</small>
      <p id="status" role="status" hidden></p>
    </div>
    <script type="module" src="/src/menu.ts"></script>
  </body>
</html>
