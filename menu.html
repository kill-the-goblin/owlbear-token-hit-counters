<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /></head>
  <body>
    <div id="app">
      <div class="controls">
        <button id="minus" type="button" aria-label="Subtract one hit point" title="Subtract 1 HP">−</button>
        <input id="hp" type="text" inputmode="numeric" autocomplete="off" aria-label="Current hit points" placeholder="HP" />
        <button id="plus" type="button" aria-label="Add one hit point" title="Add 1 HP">+</button>
      </div>
      <p id="status" role="status" hidden></p>
    </div>
    <script type="module" src="/src/menu.ts"></script>
  </body>
</html>
